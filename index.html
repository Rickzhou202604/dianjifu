<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典籍府 - 中华传统文化数字典藏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; background: #faf6f0; color: #3a2a1a; min-height: 100vh; }
header { background: linear-gradient(135deg, #1a0a00, #3d1f00, #5c2d00); color: #f5e6c8; padding: 40px 20px 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
header h1 { font-size: 2.4em; letter-spacing: 0.3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
header p { font-size: 1em; opacity: 0.8; letter-spacing: 0.15em; }
.stats-bar { display: flex; justify-content: center; gap: 40px; padding: 20px; background: #fff8ee; border-bottom: 1px solid #d4b896; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .num { font-size: 1.6em; color: #8b4513; font-weight: bold; }
.stat .label { font-size: 0.85em; color: #7a5c3a; letter-spacing: 0.1em; }
.search-section { max-width: 800px; margin: 30px auto; padding: 0 20px; }
.search-box { display: flex; gap: 10px; flex-wrap: wrap; }
.search-box input { flex: 1; min-width: 200px; padding: 14px 20px; font-size: 1.1em; border: 2px solid #c9a96e; border-radius: 8px; background: #fffdf8; color: #3a2a1a; font-family: inherit; outline: none; }
.search-box input:focus { border-color: #8b4513; box-shadow: 0 0 8px rgba(139,69,19,0.2); }
.search-box select { padding: 14px 16px; font-size: 1em; border: 2px solid #c9a96e; border-radius: 8px; background: #fffdf8; color: #3a2a1a; font-family: inherit; cursor: pointer; outline: none; }
.search-box button { padding: 14px 30px; font-size: 1.1em; background: linear-gradient(135deg, #8b4513, #a0522d); color: #fff8ee; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; letter-spacing: 0.15em; transition: all 0.3s; }
.search-box button:hover { background: linear-gradient(135deg, #a0522d, #c07840); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,69,19,0.3); }
.results-info { max-width: 800px; margin: 10px auto 0; padding: 0 20px; font-size: 0.9em; color: #7a5c3a; text-align: center; }
.poem-list { max-width: 800px; margin: 20px auto; padding: 0 20px 40px; }
.poem-item { background: #fffdf8; border: 1px solid #e8d5b5; border-radius: 10px; padding: 22px 28px; margin-bottom: 18px; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.poem-item:hover { border-color: #c9a96e; box-shadow: 0 4px 16px rgba(139,69,19,0.12); transform: translateY(-2px); }
.poem-title { font-size: 1.25em; color: #5c2d00; margin-bottom: 8px; letter-spacing: 0.08em; }
.poem-meta { font-size: 0.88em; color: #9a7a5a; margin-bottom: 12px; }
.poem-meta span { margin-right: 18px; }
.poem-orig { font-size: 1.05em; color: #2a1a0a; line-height: 1.9; letter-spacing: 0.05em; white-space: pre-line; border-left: 3px solid #c9a96e; padding-left: 14px; }
.loading { text-align: center; padding: 40px; color: #9a7a5a; font-size: 1em; letter-spacing: 0.1em; }
.empty { text-align: center; padding: 60px 20px; color: #9a7a5a; font-size: 1.1em; }
.empty-icon { font-size: 3em; margin-bottom: 16px; opacity: 0.5; }
.tabs { max-width: 800px; margin: 0 auto; padding: 20px 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
.tab { padding: 10px 22px; border: 1px solid #c9a96e; border-radius: 20px; cursor: pointer; font-size: 0.92em; color: #7a5c3a; background: #fffdf8; transition: all 0.2s; font-family: inherit; }
.tab.active, .tab:hover { background: #8b4513; color: #fff8ee; border-color: #8b4513; }
.detail-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.detail-overlay.show { display: flex; }
.detail-modal { background: #fffdf8; border-radius: 14px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 36px 40px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.detail-modal .close-btn { position: absolute; top: 16px; right: 20px; font-size: 1.6em; cursor: pointer; color: #9a7a5a; background: none; border: none; }
.detail-title { font-size: 1.8em; color: #3a1a00; margin-bottom: 10px; letter-spacing: 0.1em; }
.detail-author { color: #8b4513; margin-bottom: 20px; font-size: 0.95em; }
.detail-section-title { font-size: 0.9em; color: #8b4513; font-weight: bold; letter-spacing: 0.12em; margin: 18px 0 8px; border-bottom: 1px solid #e8d5b5; padding-bottom: 6px; }
.detail-orig { font-size: 1.15em; color: #2a1a0a; line-height: 2.1; letter-spacing: 0.06em; white-space: pre-line; background: #faf3e3; padding: 18px 22px; border-radius: 8px; border-left: 4px solid #8b4513; margin: 14px 0; }
.detail-translate { font-size: 1em; color: #5a4a3a; line-height: 1.9; font-style: italic; }
.detail-notes { font-size: 0.92em; color: #6a5a4a; line-height: 1.8; }
.st-type-tag { display: inline-block; padding: 3px 10px; background: #f0e0c8; color: #7a5c3a; border-radius: 12px; font-size: 0.8em; margin-right: 8px; }
footer { text-align: center; padding: 30px; color: #9a7a5a; font-size: 0.85em; border-top: 1px solid #e8d5b5; margin-top: 40px; }
</style>
</head>
<body>

<header>
  <h1>典籍府</h1>
  <p>中华传统文化数字典藏</p>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="num" id="statTotal">--</div><div class="label">典籍总计</div></div>
  <div class="stat"><div class="num" id="statTang">--</div><div class="label">唐诗</div></div>
  <div class="stat"><div class="num" id="statSong">--</div><div class="label">宋词</div></div>
  <div class="stat"><div class="num" id="statTerms">--</div><div class="label">节气</div></div>
  <div class="stat"><div class="num" id="statFest">--</div><div class="label">节日</div></div>
</div>

<div class="search-section">
  <div class="tabs">
    <button class="tab active" data-genre="" onclick="setGenre('')">全部</button>
    <button class="tab" data-genre="唐诗" onclick="setGenre('唐诗')">唐诗</button>
    <button class="tab" data-genre="宋词" onclick="setGenre('宋词')">宋词</button>
    <button class="tab" data-genre="四书五经" onclick="setGenre('四书五经')">四书五经</button>
  </div>
  <div class="search-box" style="margin-top:14px;">
    <input type="text" id="keywordInput" placeholder="搜索诗词、作者、朝代..." onkeydown="if(event.key==='Enter')doSearch()">
    <select id="dynastySelect">
      <option value="">全部朝代</option>
      <option value="唐代">唐代</option>
      <option value="宋代">宋代</option>
      <option value="五代">五代</option>
    </select>
    <button onclick="doSearch()">检索</button>
  </div>
</div>

<div class="results-info" id="resultsInfo"></div>
<div class="poem-list" id="poemList">
  <div class="empty">
    <div class="empty-icon">☯</div>
    <div>输入关键词，即可检索典籍</div>
  </div>
</div>

<footer>典籍府 &copy; 2026 | 中华传统文化数字典藏平台 | 纯静态版本</footer>

<script src="data.js"></script>
<script>
let currentGenre = '';
let currentPage = 1;

function loadStats() {
  document.getElementById('statTotal').textContent = STATS_DATA.total;
  document.getElementById('statTang').textContent = STATS_DATA.tang_poems;
  document.getElementById('statSong').textContent = STATS_DATA.song_lyrics;
  document.getElementById('statTerms').textContent = STATS_DATA.solar_terms || 24;
  document.getElementById('statFest').textContent = STATS_DATA.festivals || 10;
}

function setGenre(genre) {
  currentGenre = genre;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.genre === genre);
  });
  currentPage = 1;
  doSearch();
}

function doSearch(page = 1) {
  currentPage = page;
  const kw = document.getElementById('keywordInput').value.trim().toLowerCase();
  const dyn = document.getElementById('dynastySelect').value;
  const genre = currentGenre;

  let filtered = CLASSICS_DATA.filter(item => {
    if (genre && item.genre !== genre) return false;
    if (dyn && item.dynasty !== dyn) return false;
    if (kw) {
      const searchIn = (item.title + item.author + item.original_text + (item.dynasty||'')).toLowerCase();
      if (!searchIn.includes(kw)) return false;
    }
    return true;
  });

  const total = filtered.length;
  const size = 20;
  const totalPages = Math.ceil(total / size);
  const start = (page - 1) * size;
  const pageData = filtered.slice(start, start + size);

  const list = document.getElementById('poemList');

  if (pageData.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">☯</div><div>未找到相关典籍</div></div>';
    document.getElementById('resultsInfo').textContent = '';
    return;
  }

  document.getElementById('resultsInfo').textContent = `共找到 ${total} 篇，第 ${page} / ${totalPages || 1} 页`;

  list.innerHTML = pageData.map(item => `
    <div class="poem-item" onclick="showDetail(${item.id})">
      <div class="poem-title">${esc(item.title)}</div>
      <div class="poem-meta">
        <span>${esc(item.author || '佚名')}</span>
        <span>${esc(item.dynasty || '')}</span>
        <span class="st-type-tag">${esc(item.genre || '')}</span>
      </div>
      <div class="poem-orig">${esc(item.original_text || '').substring(0, 80)}${(item.original_text||'').length > 80 ? '…' : ''}</div>
    </div>
  `).join('');

  if (totalPages > 1) {
    list.innerHTML += `<div style="text-align:center;padding:20px;color:#7a5c3a;">
      ${page > 1 ? `<button onclick="doSearch(${page-1})" style="padding:8px 20px;margin-right:10px;cursor:pointer;border:1px solid #c9a96e;background:#fffdf8;color:#7a5c3a;border-radius:6px;">上一页</button>` : ''}
      第 ${page} / ${totalPages} 页
      ${page < totalPages ? `<button onclick="doSearch(${page+1})" style="padding:8px 20px;margin-left:10px;cursor:pointer;border:1px solid #c9a96e;background:#fffdf8;color:#7a5c3a;border-radius:6px;">下一页</button>` : ''}
    </div>`;
  }
}

function showDetail(id) {
  const d = CLASSICS_DATA.find(item => item.id === id);
  if (!d) return;

  const div = document.createElement('div');
  div.className = 'detail-overlay show';
  div.onclick = e => { if (e.target === div) div.remove(); };
  div.innerHTML = `
    <div class="detail-modal">
      <button class="close-btn" onclick="this.closest('.detail-overlay').remove()">✕</button>
      <div class="detail-title">${esc(d.title)}</div>
      <div class="detail-author">${esc(d.author||'佚名')} · ${esc(d.dynasty||'')} · ${esc(d.genre||'')}</div>
      <div class="detail-section-title">原文</div>
      <div class="detail-orig">${esc(d.original_text||'暂无')}</div>
      ${d.translated_text ? `<div class="detail-section-title">译文</div><div class="detail-translate">${esc(d.translated_text)}</div>` : ''}
      ${d.notes ? `<div class="detail-section-title">注释</div><div class="detail-notes">${esc(d.notes)}</div>` : ''}
    </div>
  `;
  document.body.appendChild(div);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

loadStats();
</script>
</body>
</html>
