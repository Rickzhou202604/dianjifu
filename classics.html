<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典籍宝库 - 典籍府</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif; background:#faf6f0; color:#3a2a1a; min-height:100vh; }
header { background:linear-gradient(135deg,#1a0a00,#3d1f00,#5c2d00); color:#f5e6c8; padding:30px 20px 20px; text-align:center; }
header h1 { font-size:2em; letter-spacing:.3em; text-shadow:2px 2px 4px rgba(0,0,0,.5); }
header p { font-size:.9em; opacity:.7; margin-top:5px; }
nav { background:#2c1500; display:flex; justify-content:center; gap:0; flex-wrap:wrap; }
nav a { color:#f5e6c8; text-decoration:none; padding:12px 24px; letter-spacing:.15em; font-size:.9em; border-bottom:3px solid transparent; transition:background .3s; }
nav a:hover { background:rgba(245,230,200,.1); border-bottom-color:#c9a96e; }
.stats-bar { display:flex; justify-content:center; gap:40px; padding:18px; background:#fff8ee; border-bottom:1px solid #d4b896; flex-wrap:wrap; }
.stat { text-align:center; }
.stat .num { font-size:1.5em; color:#8b4513; font-weight:bold; }
.stat .label { font-size:.8em; color:#7a5c3a; letter-spacing:.1em; }
.search-section { max-width:800px; margin:30px auto; padding:0 20px; }
.search-box { display:flex; gap:10px; flex-wrap:wrap; }
.search-box input { flex:1; min-width:200px; padding:14px 20px; font-size:1.1em; border:2px solid #c9a96e; border-radius:8px; background:#fffdf8; color:#3a2a1a; font-family:inherit; outline:none; }
.search-box input:focus { border-color:#8b4513; box-shadow:0 0 8px rgba(139,69,19,.2); }
.search-box select { padding:14px 16px; font-size:1em; border:2px solid #c9a96e; border-radius:8px; background:#fffdf8; color:#3a2a1a; font-family:inherit; cursor:pointer; outline:none; }
.search-box button { padding:14px 30px; font-size:1.1em; background:linear-gradient(135deg,#8b4513,#a0522d); color:#fff8ee; border:none; border-radius:8px; cursor:pointer; font-family:inherit; letter-spacing:.15em; transition:all .3s; }
.search-box button:hover { background:linear-gradient(135deg,#a0522d,#c07840); transform:translateY(-1px); box-shadow:0 4px 12px rgba(139,69,19,.3); }
.results-info { max-width:800px; margin:10px auto 0; padding:0 20px; font-size:.9em; color:#7a5c3a; text-align:center; }
.container { max-width:960px; margin:0 auto; padding:40px 20px; }
.poem-list { display:flex; flex-direction:column; gap:20px; }
.poem-item { background:#fff; border:1px solid #e8d8c0; border-radius:12px; padding:28px 32px; box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .3s,box-shadow .3s; }
.poem-item:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.1); }
.poem-item .meta { display:flex; gap:16px; margin-bottom:12px; flex-wrap:wrap; }
.poem-item .tag { background:#f5e6c8; color:#8b4513; padding:3px 12px; border-radius:20px; font-size:.8em; letter-spacing:.05em; }
.poem-item h3 { font-size:1.4em; color:#3a2a1a; margin-bottom:8px; }
.poem-item .author { font-size:.9em; color:#8b4513; margin-bottom:12px; }
.poem-item .original { font-size:1.15em; line-height:2; color:#3a2a1a; margin-bottom:12px; white-space:pre-line; }
.poem-item .translated { font-size:.9em; color:#7a5c3a; line-height:1.9; background:#faf6f0; padding:14px; border-radius:6px; }
footer { background:#1a0a00; color:#c9a96e; text-align:center; padding:24px 20px; font-size:.85em; }
footer a { color:#f5e6c8; text-decoration:none; }
@media(max-width:768px){header h1{font-size:1.5em;}.container{padding:20px 16px;}.poem-item{padding:20px;}}
</style>
</head>
<body>
<header><h1>典籍府</h1><p>中华传统文化数字典藏平台</p></header>
<nav>
<a href="index.html">首页</a><a href="about.html">部门概况</a><a href="classics.html">典籍宝库</a><a href="products.html">成果与产品</a><a href="news.html">新闻动态</a><a href="contact.html">联系我们</a>
</nav>

<div class="stats-bar">
<div class="stat"><div class="num">1636+</div><div class="label">收录典籍</div></div>
<div class="stat"><div class="num">唐诗</div><div class="label">宋词</div></div>
<div class="stat"><div class="num">节气</div><div class="label">节日</div></div>
</div>

<div class="search-section">
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入关键词，检索典籍...">
<select id="genreFilter"><option value="">全部类别</option><option value="唐诗">唐诗</option><option value="宋词">宋词</option><option value="节气">节气</option><option value="节日">节日</option></select>
<button onclick="renderPoems()">检索</button>
</div>
<div class="results-info" id="resultsInfo"></div>
</div>

<div class="container">
<div class="poem-list" id="poemList"></div>
</div>

<footer>
<p>典籍府 · 中枢院业务部门 &nbsp;|&nbsp; <a href="index.html">返回首页</a> &nbsp;|&nbsp; <a href="contact.html">联系我们</a></p>
</footer>

<script src="data.js"></script>
<script>
const genreMap = {'':'', '唐诗':'唐诗', '宋词':'宋词', '节气':'节气', '节日':'节日'};
const dynastyMap = {'':'', '唐':'唐代', '宋':'宋代', '五代':'五代'};
let allPoems = [];

function init() {
    allPoems = typeof CLASSICS_DATA !== 'undefined' ? CLASSICS_DATA : [];
    renderPoems();
}

function renderPoems() {
    const kw = document.getElementById('searchInput').value.trim();
    const genre = document.getElementById('genreFilter').value;
    const list = document.getElementById('poemList');
    const info = document.getElementById('resultsInfo');
    const filtered = allPoems.filter(p => {
        const matchKw = !kw || p.title.includes(kw) || p.author.includes(kw) || (p.original_text && p.original_text.includes(kw));
        const matchGenre = !genre || p.genre === genre;
        return matchKw && matchGenre;
    });
    info.textContent = '共找到 ' + filtered.length + ' 条典籍';
    if (filtered.length === 0) { list.innerHTML = '<p style="text-align:center;color:#8b4513;padding:40px;">未找到匹配典籍，请尝试其他关键词</p>'; return; }
    list.innerHTML = filtered.map(p => '<div class="poem-item"><div class="meta"><span class="tag">' + (p.genre||'') + '</span><span class="tag">' + (p.dynasty||'') + '</span></div><h3>' + p.title + '</h3><div class="author">' + (p.author||'') + '</div><div class="original">' + (p.original_text||'').replace(/\\n/g,'\n') + '</div><div class="translated">' + (p.translated_text||'') + '</div></div>').join('');
}

document.getElementById('searchInput').addEventListener('keypress', function(e){ if(e.key==='Enter') renderPoems(); });
init();
</script>
</body>
</html>
